name: Build and Deploy

on:
  push:
    branches:
      - staging

env:
  REGISTRY: 172.16.2.228:5000

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  changes:
    runs-on: asus
    outputs:
      api: ${{ steps.filter.outputs.api }}
      api-code: ${{ steps.filter.outputs.api-code }}
      web: ${{ steps.filter.outputs.web }}
      web-code: ${{ steps.filter.outputs.web-code }}
      llm: ${{ steps.filter.outputs.llm }}
      llm-code: ${{ steps.filter.outputs.llm-code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'ms-esdm/**'
              - 'deploy/magma-ai-api.container'
            api-code:
              - 'ms-esdm/**'
            web:
              - 'fe-esdm/**'
              - 'deploy/magma-ai-web.container'
            web-code:
              - 'fe-esdm/**'
            llm:
              - 'openai_local/**'
              - 'deploy/magma-ai-llm.container'
            llm-code:
              - 'openai_local/**'

  # ── Backend ────────────────────────────────────────────
  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: asus
    steps:
      - uses: actions/checkout@v4

      - name: Write env file
        run: |
          mkdir -p /opt/secrets/ms-esdm
          echo "${{ secrets.MS_ESDM_ENV }}" > /opt/secrets/ms-esdm/.env

      - name: Build image
        if: needs.changes.outputs.api-code == 'true'
        run: |
          podman build -t ${{ env.REGISTRY }}/magma-ai-api:${{ github.sha }} ms-esdm/

      - name: Push image
        if: needs.changes.outputs.api-code == 'true'
        run: |
          podman push ${{ env.REGISTRY }}/magma-ai-api:${{ github.sha }}

      - name: Prepare host volumes
        run: |
          mkdir -p /mnt/data/magma-ai/blobs
          chmod 755 /mnt/data/magma-ai/blobs

      - name: Install Quadlet unit
        run: |
          mkdir -p /etc/containers/systemd
          cp deploy/magma-ai-api.container /etc/containers/systemd/
          systemctl daemon-reload

      - name: Deploy new image
        if: needs.changes.outputs.api-code == 'true'
        run: |
          SERVICE=magma-ai-api IMAGE=${{ env.REGISTRY }}/magma-ai-api:${{ github.sha }} make rebuild

      - name: Restart service (quadlet-only change)
        if: needs.changes.outputs.api-code == 'false'
        run: systemctl restart magma-ai-api

  # ── Frontend ────────────────────────────────────────────
  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: asus
    steps:
      - uses: actions/checkout@v4

      - name: Write build env
        if: needs.changes.outputs.web-code == 'true'
        run: echo "${{ secrets.FE_ESDM_ENV }}" > fe-esdm/.env

      - name: Build image
        if: needs.changes.outputs.web-code == 'true'
        run: |
          podman build -t ${{ env.REGISTRY }}/magma-ai-web:${{ github.sha }} fe-esdm/

      - name: Push image
        if: needs.changes.outputs.web-code == 'true'
        run: |
          podman push ${{ env.REGISTRY }}/magma-ai-web:${{ github.sha }}

      - name: Install Quadlet unit
        run: |
          mkdir -p /etc/containers/systemd
          cp deploy/magma-ai-web.container /etc/containers/systemd/
          systemctl daemon-reload

      - name: Deploy new image
        if: needs.changes.outputs.web-code == 'true'
        run: |
          SERVICE=magma-ai-web IMAGE=${{ env.REGISTRY }}/magma-ai-web:${{ github.sha }} make rebuild

      - name: Restart service (quadlet-only change)
        if: needs.changes.outputs.web-code == 'false'
        run: systemctl restart magma-ai-web

  # ── LLM Server (expensive build — skips if image already exists) ──
  deploy-llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    runs-on: asus
    steps:
      - uses: actions/checkout@v4

      - name: Compute content hash
        id: hash
        run: |
          TAG=$(git ls-tree -r HEAD -- openai_local/ | sha256sum | head -c 12)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Check if image already exists in registry
        id: check
        run: |
          if podman manifest inspect ${{ env.REGISTRY }}/magma-ai-llm:${{ steps.hash.outputs.tag }} > /dev/null 2>&1; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Write env file
        run: |
          mkdir -p /opt/secrets/openai-local
          echo "${{ secrets.OPENAI_LOCAL_ENV }}" > /opt/secrets/openai-local/.env

      - name: Build image
        if: steps.check.outputs.skip_build == 'false'
        run: |
          podman build -t ${{ env.REGISTRY }}/magma-ai-llm:${{ steps.hash.outputs.tag }} openai_local/

      - name: Push image
        if: steps.check.outputs.skip_build == 'false'
        run: |
          podman push ${{ env.REGISTRY }}/magma-ai-llm:${{ steps.hash.outputs.tag }}

      - name: Install Quadlet unit
        run: |
          mkdir -p /etc/containers/systemd
          cp deploy/magma-ai-llm.container /etc/containers/systemd/
          systemctl daemon-reload

      - name: Deploy
        run: |
          SERVICE=magma-ai-llm IMAGE=${{ env.REGISTRY }}/magma-ai-llm:${{ steps.hash.outputs.tag }} make rebuild
