version: '3.9'

services:
  backend:
    build:
      context: ./ms-esdm
    container_name: ms-esdm-backend
    env_file:
      - ./ms-esdm/.env
    expose:
      - "8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_search:
      - .
    extra_hosts:
      - "magma.esdm.go.id:103.87.161.61"
    volumes:
      - /mnt/data/magma-ai/blobs:/app/blobs:z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openai-local:
    build:
      context: ./openai_local
    container_name: openai-local
    entrypoint: ["python3", "main.py"]
    env_file:
      - ./openai_local/.env
    expose:
      - "8002"
    volumes:
      - /mnt/data/magma-ai/models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./fe-esdm
    container_name: fe-esdm-frontend
    depends_on:
      - backend
    expose:
      - "8090"

  nginx:
    image: nginx:latest
    container_name: esdm-nginx
    depends_on:
      - frontend
      - backend
      - openai-local
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
